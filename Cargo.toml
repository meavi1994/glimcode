[package]
name = "glimcode"
version = "0.1.3"
edition = "2024"
description = "A lightweight, IntelliJ-inspired native code editor for the AI coding era"
repository = "https://github.com/meavi1994/glimcode"
readme = "README.md"
keywords = ["editor", "ide", "tree-sitter", "ripgrep", "egui"]
categories = ["development-tools", "text-editors", "gui"]
license = "MIT"

[dependencies]
anyhow = "1"
csv = "1.3"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33", features = ["syntect", "file", "http", "image", "svg_text"] }
egui-data-table = { version = "0.10", path = "vendor/egui-data-table" }
egui_commonmark = { version = "0.22", path = "vendor/egui_commonmark", features = ["better_syntax_highlighting"] }
rfd = "0.15"
serde_json = "1"
regex = "1"
grep = "0.4"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
url = "2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
portable-pty = "0.9"
vt100 = "0.16"
shell-words = "1"
comrak = { version = "0.56", default-features = false }

[profile.release]
lto = "thin"

[features]
ui-capture = []
